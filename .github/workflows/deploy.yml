name: Deploy to Cloudflare Pages

# main にマージされたら Cloudflare Pages へ配信する。
# ビルドは GitHub Actions 側で行い、成果物だけを Direct Upload する
# （Cloudflare 側のビルドを使わないので、Pages のビルド枠を消費しない）。
on:
  push:
    branches: [main]
    # 配信物に影響しない変更（ドキュメント等）ではデプロイしない。
    # 無料枠のデプロイ回数（500 回/月）を無駄に使わないため
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'vite.config.ts'
      - 'tsconfig.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy.yml'
  # ドキュメントだけ直した後などに手動で流したい場合用
  workflow_dispatch:

# 連続マージ時に古いデプロイを打ち切る。同時に 2 つ本番へ上げない
concurrency:
  group: deploy-cloudflare-pages
  cancel-in-progress: true

jobs:
  deploy:
    name: build & publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      deployments: write

    steps:
      - uses: actions/checkout@v4

      # 接続情報が欠けたままビルドすると、画面を開いた瞬間に落ちるバンドルが
      # 本番へ上がってしまう。値そのものは出さず、設定漏れだけをここで検出する
      - name: Check required secrets and variables
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_PAGES_PROJECT_NAME: ${{ vars.CF_PAGES_PROJECT_NAME }}
        run: |
          missing=""
          for name in VITE_SUPABASE_URL VITE_SUPABASE_ANON_KEY CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID CF_PAGES_PROJECT_NAME; do
            if [ -z "${!name}" ]; then
              missing="${missing} ${name}"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::error::未設定の項目があります:${missing}"
            echo "設定手順は docs/deployment.md を参照してください。" >&2
            exit 1
          fi
          echo "必要な Secrets / Variables はすべて設定済みです。"

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Publish to Cloudflare Pages
        id: publish
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # メジャーで固定する。上げるときは docs/deployment.md の手順に従う
          wranglerVersion: '4'
          command: >-
            pages deploy dist
            --project-name=${{ vars.CF_PAGES_PROJECT_NAME }}
            --branch=${{ github.ref_name }}

      - name: Write deployment URL to summary
        run: |
          {
            echo "### Cloudflare Pages"
            echo ""
            echo "- デプロイ先: ${{ steps.publish.outputs.deployment-url }}"
            echo "- コミット: \`${{ github.sha }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
